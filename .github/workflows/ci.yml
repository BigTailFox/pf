name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    env:
      PF_VALIDATION_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: uv sync --group test
      - name: PR validation
        if: matrix.python-version != '3.10'
        run: uv run python scripts/validate.py pr --base "$PF_VALIDATION_BASE"
      - name: Coverage validation
        if: matrix.python-version == '3.10'
        run: uv run python scripts/validate.py coverage --base "$PF_VALIDATION_BASE"
      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-${{ matrix.os }}-${{ matrix.python-version }}
          path: tests/.cache/validation/
          include-hidden-files: true
          if-no-files-found: ignore
      - name: Upload coverage data
        if: matrix.python-version == '3.10'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}
          path: tests/.cache/cov/.coverage*
          include-hidden-files: true
          if-no-files-found: error

  coverage:
    needs: test
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.10"
      - name: Install
        run: uv sync --group test
      - name: Download coverage data
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          path: tests/.cache/cov/incoming
      - name: Combine coverage and apply fail_under
        run: |
          uv run coverage combine $(find tests/.cache/cov/incoming -name '.coverage*')
          uv run coverage report --show-missing
