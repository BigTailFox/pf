[project]
name = "pf"
version = "0.1.0"
description = "pf finds the floor the package can stand on for you."
readme = "README.md"
authors = [
    { name = "liulihao", email = "liulihao.leo@bytedance.com" }
]
requires-python = ">=3.10"
dependencies = [
    "cyclopts>=4.0",
    "packaging>=25.0",
    "pydantic>=2.0",
    "rich>=14.0",
    "tomli>=2.0",
    "tomlkit>=0.13",
    "ty>=0.0.56",
]

[dependency-groups]
dev = [
    "pytest>=9.1",
    "pytest-benchmark>=5.2",
    "pytest-cov>=7.1",
    "pytest-testmon>=2.2",
]

[project.scripts]
pf = "pf.cli:main"

[build-system]
requires = ["uv_build>=0.8.22,<0.9.0"]
build-backend = "uv_build"
