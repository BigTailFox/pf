[project]
name = "pf"
version = "0.1.0"
description = "pf finds the floor the package can stand on for you."
readme = "README.md"
authors = [
    { name = "liulihao", email = "liulihao.leo@bytedance.com" }
]
requires-python = ">=3.10, <3.13"
dependencies = [
    "cyclopts>=4.0",
    "packaging>=25.0",
    "pydantic>=2.0",
    "rich>=14.0",
    "tomli>=2.0",
    "tomlkit>=0.13",
    "ty>=0.0.56",
]

[dependency-groups]
dev = [
    "pytest>=9.1",
    "pytest-benchmark>=5.2",
    "pytest-cov>=7.1",
    "pytest-env>=1.2",
    "pytest-testmon>=2.2",
]
test = [{ include-group = "dev" }]

[project.scripts]
pf = "pf.cli:main"

[build-system]
requires = ["uv_build>=0.8.22,<0.9.0"]
build-backend = "uv_build"

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.pytest.ini_options]
addopts = ["--testmon"]
cache_dir = "tests/.cache/pytest"
required_plugins = [
    "pytest-cov>=7.1",
    "pytest-env>=1.2",
    "pytest-testmon>=2.2",
]

[tool.pytest_env]
TESTMON_DATAFILE = "tests/.cache/testmon/.testmondata"

[tool.coverage.run]
branch = true
data_file = "tests/.cache/cov/.coverage"

[tool.coverage.html]
directory = "tests/.cache/cov/html"

[tool.coverage.report]
fail_under = 90

[tool.pf]
test-command = ["pytest", "--no-testmon"]
