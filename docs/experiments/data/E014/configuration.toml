# PF dogfood (E014). Keep E007/E008 experiment contract: i18n is required by
# the unit tests, min-versions stays outside the Cell matrix, pathspec keeps
# the temporary <=0.12.1 cap that avoids the draft_docs indent break.
# Python list is lexicographically sorted as required by D001.
[dependency-groups]
pf-unit = ["mkdocs[i18n]"]

[tool.pf]
pythons = ["3.10", "3.11", "3.12", "3.8", "3.9"]
test-group = "pf-unit"
extra-policy = "none"
test-command = [
    "python",
    "-m",
    "unittest",
    "discover",
    "-s",
    "mkdocs",
    "-p",
    "*tests.py",
]
search-space = "all"
search-resolution = "minor"
