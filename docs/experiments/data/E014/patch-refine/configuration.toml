# PF dogfood (E014) phase 2: patch refine inside the all×minor declaration
# minors. Intermediate floors from apply are the new declarations.
[dependency-groups]
pf-unit = ["mkdocs[i18n]"]

[tool.pf]
pythons = ["3.10", "3.11", "3.12", "3.8", "3.9"]
test-group = "pf-unit"
extra-policy = "none"
test-command = [
    "python",
    "-m",
    "unittest",
    "discover",
    "-s",
    "mkdocs",
    "-p",
    "*tests.py",
]
search-space = "minors[declaration]"
search-resolution = "patch"
